quarkus:
  log:
    level: INFO

  ##################################################
  # Redis
  ##################################################
  redis:
    hosts: redis://localhost:6379
    password: test1234

  ##################################################
  # OpenTelemetry
  ##################################################
  otel:
    enabled: true

    logs:
      enabled: true

    metrics:
      enabled: true

    traces:
      enabled: true

    exporter:
      otlp:
        endpoint: http://localhost:4317

  ##################################################
  # LangChain4j
  ##################################################
  langchain4j:

    neo4j:
      dimension: 768

    chat-model:
      provider: openai

    embedding-model:
      provider: ollama

    openai:
      base-url: http://localhost:9999/v1
      api-key: dummy
      timeout: 3000s

      chat-model:
        model-name: Qwen2.5-7B-Instruct-Q4_K_M
        temperature: 0.2
        max-tokens: 2048
        log-requests: true
        log-responses: true

    ollama:
      base-url: http://localhost:11434
      timeout: 3000s

      embedding-model:
        model-id: nomic-embed-text

  ##################################################
  # Neo4j
  ##################################################
  neo4j:
    uri: bolt://localhost:7687

    authentication:
      username: neo4j
      password: test1234

  ##################################################
  # Keycloak / OIDC
  ##################################################
  oidc:
    auth-server-url: http://localhost:8088/realms/find-dog-ia
    application-type: service
    client-id: find-dog-client-id

#    credentials:
#      secret: LHJe20fo3Nx4y0SwoXD8sqbAeSkFAVKH

    roles:
      role-claim-path: realm_access/roles
      role-claim-separator: " "

  ##################################################
  # Security
  ##################################################
  http:
    auth:
      permission:

        public:
          paths: /hello
          policy: permit

        secured:
          paths: /*
          policy: authenticated

##################################################
# Application - Redis keys (mapped by RedisConfig)
##################################################
redis:
  keys:
    input-tokens: "userId:%s:tokens:input:total"
    output-tokens: "userId:%s:tokens:output:total"
    total-tokens: "userId:%s:tokens:total"

##################################################
# Application - Token limit
##################################################
token:
  limit: 500000